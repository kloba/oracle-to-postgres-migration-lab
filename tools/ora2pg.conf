# ===========================================================================
# tools/ora2pg.conf
#
# Contoso Store -- Oracle to Azure Database for PostgreSQL migration lab.
#
# THE DATA STEP, WHICH THE CONVERSION TOOL DOES NOT DO.
#
# The AI-assisted conversion in the PostgreSQL extension for Visual Studio Code
# (ms-ossdata.vscode-pgsql) converts SCHEMA AND CODE ONLY. It does not copy a
# single table row. This file drives the separate row-copy stage described in
# docs/04-migrate-data.md.
#
# It is therefore configured for TYPE COPY, not TYPE TABLE: the schema already
# exists on the target, converted and reviewed. Letting ora2pg emit its own DDL
# here would silently replace the artefact the whole lab exists to evaluate.
#
#   ora2pg -c tools/ora2pg.conf
#
# NO PASSWORDS LIVE IN THIS FILE. ORACLE_PWD and PG_PWD are left empty on
# purpose; see "Credentials" below. This is a public repository.
# ===========================================================================


# ---------------------------------------------------------------------------
# Source: the Oracle VM (or the local container)
# ---------------------------------------------------------------------------
# ORACLE_HOST/ORACLE_PORT/ORACLE_SERVICE in .env. On the Azure path you reach
# the VM through an `az network bastion tunnel` + `ssh -L`, so the DSN below
# points at the local end of that forward, not at 10.42.1.10 directly --
# scripts/connect.sh prints the port it chose.
ORACLE_DSN      dbi:Oracle:host=127.0.0.1;service_name=FREEPDB1;port=1521

# O2P_READER holds CONNECT + SELECT_CATALOG_ROLE + SELECT ON SYS.ARGUMENT$ and
# is what the conversion tool reads metadata with. It deliberately has NO
# privilege on the application tables, so it cannot be used for the row copy.
# The data step needs real SELECT on CONTOSO's tables: use CONTOSO itself.
ORACLE_USER     CONTOSO
ORACLE_PWD

# The schema being migrated. Fixed by the contract -- do not rename.
SCHEMA          CONTOSO

# CONTOSO owns everything it needs, so do not pay for the ALL_* dictionary
# views. This is a large speed-up on a ~1,855-object schema.
USER_GRANTS     1


# ---------------------------------------------------------------------------
# Target: Azure Database for PostgreSQL flexible server
# ---------------------------------------------------------------------------
# The server has no public endpoint. Run ora2pg from the jumpbox or the Oracle
# VM, or through the same tunnel. sslmode=require, never disable: the traffic
# crosses the VNet.
PG_DSN          dbi:Pg:dbname=contoso_store;host=o2p-pg-CHANGEME.postgres.database.azure.com;port=5432;sslmode=require
PG_USER         o2padmin
PG_PWD

# Fixed by the contract -- do not rename. The converted schema lands in
# contoso, not public, so the copy has to be told where to put the rows.
PG_SCHEMA       contoso
EXPORT_SCHEMA   1

# The target is 15 or later (MERGE, and the conversion tool's scratch floor).
PG_VERSION      16


# ---------------------------------------------------------------------------
# Credentials
# ---------------------------------------------------------------------------
# ora2pg does not expand environment variables in its configuration file, and
# this repository does not commit secrets. The documented pattern in
# docs/04-migrate-data.md renders a 0600 copy in a private temp directory,
# substitutes the two passwords from .env (or from az keyvault), runs ora2pg
# against that copy, and deletes it on exit -- including on failure. This is
# the same shape scripts/deploy.sh uses for ARM parameters, and for the same
# reason: nothing sensitive should ever be visible to `ps`.


# ---------------------------------------------------------------------------
# What to export
# ---------------------------------------------------------------------------
# COPY streams Oracle -> PostgreSQL in one process. INSERT emits a file you can
# replay; it is roughly an order of magnitude slower and is only worth it when
# you need to inspect or patch the payload before it lands.
TYPE            COPY

# Objects to leave alone. Every one of these is a deliberate decision, not a
# default:
#
#   MLOG$_*        materialised view logs. Oracle's fast-refresh plumbing.
#                  Copying them would move change records that describe a
#                  refresh mechanism PostgreSQL does not have (H-15).
#   MV container   a materialised view's container TABLE is populated by
#                  REFRESH, not by a row copy. Copy it and the first refresh
#                  on the target duplicates every row.
#   STG_GEN_*      the generator's staging family. Empty by design.
#   *_NTAB         nested-table storage tables. Oracle populates these through
#                  the parent column, and ora2pg cannot address them directly.
EXCLUDE         MLOG$_.* MV_.* STG_GEN_.* .*_NTAB

# Global temporary tables hold session-scoped rows. There is nothing in them to
# copy, and on Oracle a GTT read from another session returns zero rows anyway.
NO_LOB_LOCATOR  0


# ---------------------------------------------------------------------------
# The LONG column (hard case H-33) -- the reason this step is not trivial
# ---------------------------------------------------------------------------
# store.legacy_migration_notes is LONG. Oracle allows exactly one per table,
# forbids it in most SQL expressions, and every extraction tool treats it as a
# special case. DBD::Oracle truncates a LONG at LongReadLen bytes and, with
# LongTruncOk off, raises rather than silently cutting -- which is what you
# want: a silently truncated migration note is a data-loss bug nobody notices.
#
# 8 MB covers the seeded values with headroom. Raise it if you widened them;
# the cost is per-fetch memory, so do not set it to something absurd.
LONGREADLEN     8388608
LONGTRUNCOK     0

# The target column is text (the conversion renders LONG -> text). ora2pg needs
# telling that a LONG is character data, not a locator.
DATA_TYPE       LONG:text,LONG RAW:bytea,XMLTYPE:xml,CLOB:text,BLOB:bytea,NCLOB:text,RAW:bytea,NUMBER:numeric,DATE:timestamp,TIMESTAMP WITH LOCAL TIME ZONE:timestamptz


# ---------------------------------------------------------------------------
# Empty string is NULL (hard case H-38) -- the quiet one
# ---------------------------------------------------------------------------
# Oracle cannot distinguish '' from NULL; PostgreSQL can. Every Oracle ''
# arrives as NULL, which is the correct and only possible reading of the
# source -- but it means a row that was IS NULL on Oracle is still IS NULL on
# PostgreSQL, while application code that writes '' on the target will now
# produce rows the converted predicates do not match.
#
# Leave this at 0. Setting it to 1 rewrites NULLs as empty strings and invents
# a distinction the source never made -- and it will make the H-38 differential
# test in docs/05-validate.md pass for the wrong reason.
EMPTY_LOB_NULL  0
NULL_EQUAL_EMPTY 0


# ---------------------------------------------------------------------------
# Throughput
# ---------------------------------------------------------------------------
# Rows per COPY batch. 10,000 is a reasonable balance on a D4ds_v5 target; the
# whole batch is held in memory on the ora2pg host, so a row with an 8 MB LONG
# in it is the constraint, not the row count.
DATA_LIMIT      10000

# JOBS            PostgreSQL-side writers
# ORACLE_COPIES   Oracle-side readers (splits each table by ROWID ranges)
# PARALLEL_TABLES tables processed concurrently
#
# 4/4/2 saturates a 4-vCore flexible server without pushing it into WAL
# backpressure. Going higher moves the bottleneck to the target's storage IOPS
# and the numbers stop improving.
JOBS            4
ORACLE_COPIES   4
PARALLEL_TABLES 2

# Oracle-side fetch size. Larger is better for the narrow fact tables and
# actively harmful for the LOB-bearing ones; ora2pg lowers it itself when it
# meets a LOB column.
FETCH_SIZE      5000


# ---------------------------------------------------------------------------
# Constraints and triggers during the load
# ---------------------------------------------------------------------------
# The converted schema has foreign keys, and the copy order is not dependency
# order. Deferring them is the difference between a load that finishes and one
# that fails on the first child row.
#
# DROP_FKEY drops and recreates them around the copy. That is the fast path,
# and it is also the dangerous one: if the run dies between the drop and the
# recreate, the target is left without referential integrity and looks fine.
# docs/05-validate.md re-checks every constraint after the load for exactly
# this reason -- do not skip that step.
DROP_FKEY       1

# Triggers on the target would fire once per copied row, re-deriving values the
# source already holds and, in the case of the audit triggers, writing a
# migration's worth of noise into contoso.audit_log.
DISABLE_TRIGGERS 1
DISABLE_SEQUENCE 1

# Sequences must be restarted past the copied maximum afterwards, or the first
# insert on the target collides with a migrated key. ora2pg does not do this as
# part of COPY -- docs/04-migrate-data.md has the query that emits the
# ALTER SEQUENCE statements.


# ---------------------------------------------------------------------------
# Character set
# ---------------------------------------------------------------------------
# The seed data is deliberately multi-country: 11 countries, accented names,
# and a Turkish row that exercises the dotless i. Force both ends to UTF-8 and
# let nothing negotiate.
NLS_LANG        AMERICAN_AMERICA.AL32UTF8
CLIENT_ENCODING UTF8
BINMODE         utf8


# ---------------------------------------------------------------------------
# Output and logging
# ---------------------------------------------------------------------------
OUTPUT_DIR      ./out/ora2pg
LOG_ON_ERROR    1
DEBUG           0
